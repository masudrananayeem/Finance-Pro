<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance-Pro | Login</title>

    <!-- FAVICON - Full Package -->
    <!-- ========================================== -->
    <link rel="icon" type="image/x-icon" href="assets/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon_io/android-chrome-512x512.png">
    <link rel="manifest" href="assets/favicon_io/site.webmanifest">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="login-page">


        <div class="left-panel">

            <h1>Finance-Pro</h1>

            <p>
                Smart Personal Finance Management System
            </p>

            <div class="illustration">
                🏦
            </div>

            <div class="feature-box">

                <div>
                    <i class="bi bi-shield-check"></i>
                    Secure Banking Experience
                </div>

                <div>
                    <i class="bi bi-graph-up-arrow"></i>
                    Track Income & Expenses
                </div>

                <div>
                    <i class="bi bi-pie-chart-fill"></i>
                    Advanced Analytics Dashboard
                </div>

            </div>

        </div>

        <div class="right-panel">

            <div class="login-card">

                <div class="logo">

                    <div class="logo-icon">
                        <i class="bi bi-bank2"></i>
                    </div>

                    <div class="brand">
                        Finance-Pro
                    </div>

                    <div class="subtitle">
                        Welcome Back
                    </div>

                </div>

                <div class="mb-3">

                    <label>Email Address</label>

                    <input id="email" type="email" class="form-control" placeholder="Enter email">

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input id="password" type="password" class="form-control" placeholder="Enter password">

                </div>

                <div class="d-flex justify-content-between mb-3">

                    <div>

                        <input type="checkbox">

                        Remember Me

                    </div>

                    <a href="#" class="text-white">
                        Forgot Password?
                    </a>

                </div>

                <button id="loginBtn" class="btn login-btn w-100">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

                <button class="btn btn-light w-100 mt-3 google-btn">

                    <i class="bi bi-google"></i>

                    Continue with Google

                </button>

                <div class="demo-box">

                    <strong>Demo Account</strong>

                    <br>

                    Email: admin@gmail.com

                    <br>

                    Password: 123456

                </div>

                <div class="stats">

                    <div>
                        <h5>10K+</h5>
                        <small>Users</small>
                    </div>

                    <div>
                        <h5>৳50M+</h5>
                        <small>Transactions</small>
                    </div>

                    <div>
                        <h5>99.9%</h5>
                        <small>Secure</small>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
