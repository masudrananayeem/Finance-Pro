
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance-Pro | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #3b82f6
            );
            overflow:hidden;
        }

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,.08);
            animation:float 8s ease-in-out infinite;
        }

        .circle1{
            width:250px;
            height:250px;
            top:5%;
            left:5%;
        }

        .circle2{
            width:180px;
            height:180px;
            bottom:10%;
            right:8%;
            animation-delay:2s;
        }

        .circle3{
            width:120px;
            height:120px;
            top:50%;
            right:30%;
            animation-delay:4s;
        }

        @keyframes float{
            0%,100%{
                transform:translateY(0);
            }
            50%{
                transform:translateY(-25px);
            }
        }

        .login-page{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px;
            position:relative;
            z-index:2;
        }

        .left-panel{
            flex:1;
            color:white;
            padding:40px;
        }

        .left-panel h1{
            font-size:3rem;
            font-weight:700;
        }

        .left-panel p{
            font-size:1.1rem;
            opacity:.9;
        }

        .feature-box{
            margin-top:30px;
        }

        .feature-box div{
            margin-bottom:15px;
            font-size:18px;
        }

        .illustration{
            font-size:180px;
            text-align:center;
            opacity:.9;
            animation:float 5s ease-in-out infinite;
        }

        .right-panel{
            flex:1;
            display:flex;
            justify-content:center;
        }

        .login-card{
            width:100%;
            max-width:450px;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,.2);
            border-radius:25px;
            padding:40px;
            color:white;
            box-shadow:0 20px 40px rgba(0,0,0,.25);
        }

        .logo{
            text-align:center;
            margin-bottom:20px;
        }

        .logo-icon{
            width:90px;
            height:90px;
            margin:auto;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            background:white;
            color:#1e3a8a;
        }

        .brand{
            margin-top:15px;
            font-size:30px;
            font-weight:700;
        }

        .subtitle{
            opacity:.8;
            font-size:14px;
        }

        .form-control{
            border:none;
            border-radius:12px;
            padding:12px;
        }

        .login-btn{
            background:white;
            color:#1e3a8a;
            border:none;
            border-radius:12px;
            padding:12px;
            font-weight:700;
        }

        .login-btn:hover{
            transform:translateY(-2px);
        }

        .google-btn{
            border-radius:12px;
        }

        .stats{
            display:flex;
            justify-content:space-between;
            text-align:center;
            margin-top:25px;
        }

        .stats h5{
            margin-bottom:0;
            font-weight:700;
        }

        .demo-box{
            margin-top:20px;
            padding:15px;
            background:rgba(255,255,255,.1);
            border-radius:12px;
            text-align:center;
            font-size:14px;
        }

        @media(max-width:991px){

            .left-panel{
                display:none;
            }

            .right-panel{
                flex:unset;
                width:100%;
            }
        }
    </style>
</head>

<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="login-page">

        <div class="left-panel">

            <h1>Finance-Pro</h1>

            <p>
                Smart Personal Finance Management System
            </p>

            <div class="illustration">
                🏦
            </div>

            <div class="feature-box">

                <div>
                    <i class="bi bi-shield-check"></i>
                    Secure Banking Experience
                </div>

                <div>
                    <i class="bi bi-graph-up-arrow"></i>
                    Track Income & Expenses
                </div>

                <div>
                    <i class="bi bi-pie-chart-fill"></i>
                    Advanced Analytics Dashboard
                </div>

            </div>

        </div>

        <div class="right-panel">

            <div class="login-card">

                <div class="logo">

                    <div class="logo-icon">
                        <i class="bi bi-bank2"></i>
                    </div>

                    <div class="brand">
                        Finance-Pro
                    </div>

                    <div class="subtitle">
                        Welcome Back
                    </div>

                </div>

                <div class="mb-3">

                    <label>Email Address</label>

                    <input
                    id="email"
                    type="email"
                    class="form-control"
                    placeholder="Enter email">

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input
                    id="password"
                    type="password"
                    class="form-control"
                    placeholder="Enter password">

                </div>

                <div class="d-flex justify-content-between mb-3">

                    <div>

                        <input type="checkbox">

                        Remember Me

                    </div>

                    <a href="#" class="text-white">
                        Forgot Password?
                    </a>

                </div>

                <button
                id="loginBtn"
                class="btn login-btn w-100">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

                <button
                class="btn btn-light w-100 mt-3 google-btn">

                    <i class="bi bi-google"></i>

                    Continue with Google

                </button>

                <div class="demo-box">

                    <strong>Demo Account</strong>

                    <br>

                    Email: admin@gmail.com

                    <br>

                    Password: 123456

                </div>

                <div class="stats">

                    <div>
                        <h5>10K+</h5>
                        <small>Users</small>
                    </div>

                    <div>
                        <h5>৳50M+</h5>
                        <small>Transactions</small>
                    </div>

                    <div>
                        <h5>99.9%</h5>
                        <small>Secure</small>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
