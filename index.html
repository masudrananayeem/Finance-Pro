<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nayeem Finance - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4361ee, #4cc9f0);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
        }

        .logo {
            font-size: 50px;
            text-align: center;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            💰
        </div>

        <h2>Nayeem Finance</h2>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input
                id="email"
                type="email"
                class="form-control"
                placeholder="Enter Email">
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input
                id="password"
                type="password"
                class="form-control"
                placeholder="Enter Password">
        </div>

        <button
            id="loginBtn"
            class="btn btn-primary w-100">

            Login

        </button>

        <div class="footer-text">
            Demo Login <br>
            Email: admin@gmail.com <br>
            Password: 123456
        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
