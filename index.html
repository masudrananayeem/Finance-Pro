
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance-Pro | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;

            background:linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #3b82f6
            );

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:'Segoe UI',sans-serif;
        }

        .login-card{

            width:100%;
            max-width:450px;

            background:rgba(255,255,255,.95);

            backdrop-filter:blur(10px);

            border-radius:25px;

            padding:40px;

            box-shadow:0 20px 40px rgba(0,0,0,.2);
        }

        .logo-section{
            text-align:center;
            margin-bottom:30px;
        }

        .bank-logo{

            width:90px;
            height:90px;

            margin:auto;

            border-radius:50%;

            background:linear-gradient(
                135deg,
                #1e3a8a,
                #3b82f6
            );

            display:flex;
            justify-content:center;
            align-items:center;

            color:white;
            font-size:42px;

            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .brand-name{

            margin-top:15px;

            font-size:30px;
            font-weight:700;

            color:#1e3a8a;
        }

        .brand-subtitle{

            color:#6c757d;
            font-size:14px;
        }

        .form-label{
            font-weight:600;
        }

        .form-control{

            padding:12px;

            border-radius:12px;
        }

        .login-btn{

            background:linear-gradient(
                135deg,
                #1e3a8a,
                #3b82f6
            );

            border:none;

            border-radius:12px;

            padding:12px;

            font-weight:600;
        }

        .login-btn:hover{

            opacity:.9;
        }

        .demo-box{

            margin-top:20px;

            background:#f8f9fa;

            padding:15px;

            border-radius:12px;

            font-size:14px;

            text-align:center;
        }

        .footer{

            margin-top:20px;

            text-align:center;

            color:#6c757d;

            font-size:13px;
        }
    </style>

</head>

<body>

    <div class="login-card">

        <!-- Logo -->

        <div class="logo-section">

            <div class="bank-logo">

                <i class="bi bi-bank2"></i>

            </div>

            <h1 class="brand-name">
                Finance-Pro
            </h1>

            <p class="brand-subtitle">
                Smart Personal Finance Management
            </p>

        </div>

        <!-- Login Form -->

        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input
            id="email"
            type="email"
            class="form-control"
            placeholder="Enter your email">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
            id="password"
            type="password"
            class="form-control"
            placeholder="Enter your password">

        </div>

        <button
        id="loginBtn"
        class="btn btn-primary w-100 login-btn">

            <i class="bi bi-box-arrow-in-right"></i>

            Login

        </button>

        <!-- Demo Login -->

        <div class="demo-box">

            <strong>Demo Account</strong>

            <br>

            Email:
            admin@gmail.com

            <br>

            Password:
            123456

        </div>

        <!-- Footer -->

        <div class="footer">

            © 2026 Finance-Pro

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
