<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Pro - Notes</title>

    <link rel="icon" type="image/x-icon" href="../assets/favicon_io/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/darkmode.css">

    <style>
        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .notes-header h2 { font-weight: 700;
            color: #0b1120;
            margin: 0; }
        .notes-header p { color: #6b7280;
            margin: 0;
            font-size: 14px; }

        .note-card {
            background: #fff;
            border-radius: 18px;
            padding: 18px 22px;
            border: 1px solid #eef2f6;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .note-card:hover { transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06); }
        .note-card .note-title { font-weight: 600;
            color: #0b1120;
            font-size: 16px;
            margin: 0; }
        .note-card .note-content { color: #6b7280;
            font-size: 14px;
            margin: 4px 0 0 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden; }
        .note-card .note-meta { display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 12px;
            color: #9ca3af; }
        .note-card .note-actions { display: flex;
            gap: 6px; }
        .note-card .note-actions button { border: none;
            background: none;
            color: #9ca3af;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px; }
        .note-card .note-actions button:hover { background: #f0f4f8;
            color: #1a1a2e; }
        .note-card .note-actions button.delete:hover { background: #fecaca;
            color: #dc2626; }
        .note-color { width: 4px;
            height: 40px;
            border-radius: 4px;
            flex-shrink: 0; }

        body.dark-mode .notes-header h2 { color: #fff; }
        body.dark-mode .note-card { background: #1a2a4a;
            border-color: rgba(255, 255, 255, 0.06); }
        body.dark-mode .note-card .note-title { color: #fff; }
        body.dark-mode .note-card .note-content { color: #94a3b8; }
        body.dark-mode .note-card .note-actions button:hover { background: rgba(255, 255, 255, 0.06);
            color: #fff; }

        .empty-notes { text-align: center;
            padding: 60px 20px;
            color: #6b7280; }
        .empty-notes i { font-size: 56px;
            color: #d1d9e6;
            margin-bottom: 16px; }
        .empty-notes h5 { color: #1a1a2e;
            font-weight: 600; }
        body.dark-mode .empty-notes i { color: #334155; }
        body.dark-mode .empty-notes h5 { color: #e5e9f0; }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="top-navbar fixed-top">
        <div class="nav-container">
            <a class="brand" href="dashboard.html">
                <span class="brand-logo-wrapper">
                    <img src="../assets/icons/logo.png" alt="FinancePro" class="brand-logo-img">
                </span>
            </a>
            <button class="hamburger-toggle" id="menuToggle"><i class="bi bi-list"></i></button>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="bi bi-grid-fill"></i><span>Dashboard</span></a></li>
                <li><a href="transactions.html"><i class="bi bi-arrow-left-right"></i><span>Transactions</span></a></li>
                <li><a href="budget.html"><i class="bi bi-pie-chart-fill"></i><span>Budget</span></a></li>
                <li><a href="goals.html"><i class="bi bi-trophy-fill"></i><span>Goals</span></a></li>
                <li><a href="savings.html"><i class="bi bi-piggy-bank-fill"></i><span>Savings</span></a></li>
                <li class="active"><a href="notes.html"><i class="bi bi-sticky-fill"></i><span>Notes</span></a></li>
                <li><a href="settings.html"><i class="bi bi-gear-fill"></i><span>Settings</span></a></li>
                <li><a href="profile.html"><i class="bi bi-person-fill"></i><span>Profile</span></a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle"><i class="bi bi-moon-fill"></i></button>
                <button class="notif-btn"><i class="bi bi-bell-fill"></i><span class="notif-dot"></span></button>
                <div class="profile-dropdown">
                    <img src="../assets/images/image.jpeg" alt="Profile" class="profile-img">
                    <div class="profile-info">
                        <span class="profile-name" id="userName">Nayeem</span>
                        <span class="profile-role">Premium</span>
                    </div>
                    <i class="bi bi-chevron-down"></i>
                </div>
                <a href="../index.html" class="logout-btn" title="Logout"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">

        <div class="notes-header">
            <div>
                <h2>📝 Notes</h2>
                <p>Quick notes and reminders</p>
            </div>
            <button class="btn btn-primary rounded-pill px-4" onclick="addNote()">
                <i class="bi bi-plus-circle me-1"></i> Add Note
            </button>
        </div>

        <div id="notesList"></div>
        <div id="emptyNotes" class="empty-notes" style="display:none;">
            <i class="bi bi-sticky"></i>
            <h5>No notes yet</h5>
            <p>Add quick notes to remember important things.</p>
            <button class="btn btn-primary rounded-pill px-4 mt-2" onclick="addNote()">
                <i class="bi bi-plus-circle me-1"></i> Create Note
            </button>
        </div>

    </main>

    <!-- Add/Edit Note Modal -->
    <div class="modal fade" id="noteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-sticky me-2"></i><span id="noteModalTitle">Add Note</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Title</label>
                        <input type="text" id="noteTitle" class="form-control" placeholder="Note title">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Content</label>
                        <textarea id="noteContent" class="form-control" rows="4" placeholder="Write your note here..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Color</label>
                        <div class="d-flex gap-2">
                            <button class="color-option active" data-color="#3b82f6" style="background:#3b82f6;width:32px;height:32px;border-radius:50%;border:2px solid #1a1a2e;"></button>
                            <button class="color-option" data-color="#059669" style="background:#059669;width:32px;height:32px;border-radius:50%;border:2px solid transparent;"></button>
                            <button class="color-option" data-color="#d97706" style="background:#d97706;width:32px;height:32px;border-radius:50%;border:2px solid transparent;"></button>
                            <button class="color-option" data-color="#dc2626" style="background:#dc2626;width:32px;height:32px;border-radius:50%;border:2px solid transparent;"></button>
                            <button class="color-option" data-color="#7c3aed" style="background:#7c3aed;width:32px;height:32px;border-radius:50%;border:2px solid transparent;"></button>
                            <button class="color-option" data-color="#ec4899" style="background:#ec4899;width:32px;height:32px;border-radius:50%;border:2px solid transparent;"></button>
                        </div>
                    </div>
                    <input type="hidden" id="editNoteId" value="">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveNote()"><i class="bi bi-check-circle me-1"></i> Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab-btn" id="fabBtn"><i class="bi bi-plus-lg"></i></button>
    <div class="fab-menu" id="fabMenu">
        <button class="fab-item" onclick="addNote()"><i class="bi bi-sticky-fill text-warning"></i><span>New Note</span></button>
        <button class="fab-item" onclick="window.location.href='transactions.html'"><i class="bi bi-arrow-left-right text-primary"></i><span>Transactions</span></button>
        <button class="fab-item" onclick="window.location.href='dashboard.html'"><i class="bi bi-grid-fill text-success"></i><span>Dashboard</span></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>

    <script>
        let selectedColor = '#3b82f6';

        document.addEventListener('DOMContentLoaded', function() {
            const fabBtn = document.getElementById('fabBtn');
            const fabMenu = document.getElementById('fabMenu');
            fabBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                fabMenu.classList.toggle('open');
            });
            document.addEventListener('click', function(e) {
                if (!fabBtn.contains(e.target) && !fabMenu.contains(e.target)) {
                    fabMenu.classList.remove('open');
                }
            });

            document.querySelectorAll('.color-option').forEach(el => {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.color-option').forEach(c => c.style.borderColor = 'transparent');
                    this.style.borderColor = '#1a1a2e';
                    selectedColor = this.dataset.color;
                });
            });
            renderNotes();
        });

        function addNote() {
            document.getElementById('noteModalTitle').textContent = 'Add Note';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('editNoteId').value = '';
            selectedColor = '#3b82f6';
            document.querySelectorAll('.color-option').forEach(c => c.style.borderColor = 'transparent');
            document.querySelector('.color-option').style.borderColor = '#1a1a2e';
            const modal = new bootstrap.Modal(document.getElementById('noteModal'));
            modal.show();
        }

        function editNote(id) {
            const notes = JSON.parse(localStorage.getItem('notes') || '[]');
            const note = notes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('noteModalTitle').textContent = 'Edit Note';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('editNoteId').value = id;
            selectedColor = note.color || '#3b82f6';
            document.querySelectorAll('.color-option').forEach(c => {
                c.style.borderColor = c.dataset.color === note.color ? '#1a1a2e' : 'transparent';
            });
            const modal = new bootstrap.Modal(document.getElementById('noteModal'));
            modal.show();
        }

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            const editId = document.getElementById('editNoteId').value;

            if (!title) { alert('Please enter a title'); return; }
            if (!content) { alert('Please enter some content'); return; }

            const notes = JSON.parse(localStorage.getItem('notes') || '[]');

            if (editId) {
                const index = notes.findIndex(n => n.id === parseInt(editId));
                if (index !== -1) notes[index] = { ...notes[index], title, content, color: selectedColor };
            } else {
                notes.push({ id: Date.now(), title, content, color: selectedColor, createdAt: new Date().toISOString() });
            }

            localStorage.setItem('notes', JSON.stringify(notes));
            bootstrap.Modal.getInstance(document.getElementById('noteModal')).hide();
            renderNotes();
        }

        function deleteNote(id) {
            if (!confirm('Delete this note?')) return;
            let notes = JSON.parse(localStorage.getItem('notes') || '[]');
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('notes', JSON.stringify(notes));
            renderNotes();
        }

        function renderNotes() {
            const notes = JSON.parse(localStorage.getItem('notes') || '[]');
            const container = document.getElementById('notesList');
            const empty = document.getElementById('emptyNotes');

            if (notes.length === 0) { container.innerHTML = '';
                empty.style.display = 'block'; return; }
            empty.style.display = 'none';

            container.innerHTML = notes.slice().reverse().map(n => `
                    <div class="note-card" onclick="editNote(${n.id})">
                        <div style="display:flex;gap:12px;align-items:flex-start;">
                            <div class="note-color" style="background:${n.color || '#3b82f6'};"></div>
                            <div style="flex:1;">
                                <h6 class="note-title">${n.title}</h6>
                                <p class="note-content">${n.content}</p>
                                <div class="note-meta">
                                    <span>${new Date(n.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                                    <div class="note-actions">
                                        <button onclick="event.stopPropagation();editNote(${n.id})" title="Edit"><i class="bi bi-pencil"></i></button>
                                        <button class="delete" onclick="event.stopPropagation();deleteNote(${n.id})" title="Delete"><i class="bi bi-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
        }
    </script>

</body>

</html>
