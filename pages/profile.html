<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/darkmode.css">

    <style>
        body {
            background: #f4f7fc;
        }

        .profile-card {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
        }

        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #4361ee;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            color: white;
        }

        .income {
            background: linear-gradient(135deg, #00b894, #55efc4);
        }

        .expense {
            background: linear-gradient(135deg, #ff6b6b, #e63946);
        }

        .balance {
            background: linear-gradient(135deg, #4361ee, #4895ef);
        }
    </style>

</head>

<body>
    <div id="navbar-container"></div>

    <div class="container py-5">

        <div class="profile-card">

            <div class="text-center">

                <img src="../assets/images/image.jpeg" class="profile-img">

                <h2 class="mt-3">
                    Masud Rana Nayeem
                </h2>

                <p class="text-muted">
                    Frontend Web Developer
                </p>

                <button class="btn btn-primary">
                    <i class="bi bi-camera-fill"></i>
                    Change Photo
                </button>

            </div>

            <hr class="my-4">

            <div class="row">

                <div class="col-md-4">

                    <div class="stat-card balance">

                        <h6>Balance</h6>

                        <h3 id="profileBalance">
                            ৳0
                        </h3>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="stat-card income">

                        <h6>Total Income</h6>

                        <h3 id="profileIncome">
                            ৳0
                        </h3>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="stat-card expense">

                        <h6>Total Expense</h6>

                        <h3 id="profileExpense">
                            ৳0
                        </h3>

                    </div>

                </div>

            </div>

            <div class="mt-4">

                <div class="info-box">

                    <strong>
                        <i class="bi bi-envelope-fill"></i>
                        Email
                    </strong>

                    <p class="mb-0">
                        nayeem@gmail.com
                    </p>

                </div>

                <div class="info-box">

                    <strong>
                        <i class="bi bi-telephone-fill"></i>
                        Phone
                    </strong>

                    <p class="mb-0">
                        +880 1XXXXXXXXX
                    </p>

                </div>

                <div class="info-box">

                    <strong>
                        <i class="bi bi-geo-alt-fill"></i>
                        Address
                    </strong>

                    <p class="mb-0">
                        Kaliganj, Bangladesh
                    </p>

                </div>

            </div>

            <div class="text-center mt-4">

                <button class="btn btn-success me-2">
                    Edit Profile
                </button>

                <button id="logoutBtn" class="btn btn-outline-danger">

                    Logout

                </button>

            </div>

        </div>



    </div>



    <script src="../js/navbar.js"></script>
    <script src="../js/profile.js"></script>

    <script> document.getElementById("logoutBtn").addEventListener("click", () => { localStorage.clear(); window.location.href = "../index.html"; }); </script>
    <script>

        if (localStorage.getItem("theme") === "dark") {

            document.body.classList.add("dark-mode");

        }


    </script>
</body>

</html>
